name: iOS Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Hylo
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Hylo
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: Hylo
        run: |
          xcodebuild \
            -project Hylo.xcodeproj \
            -scheme Hylo \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=$(pwd)/build \
            build

      - name: Zip simulator app
        run: |
          cd Hylo/build/Release-iphonesimulator
          zip -r Hylo-${{ github.ref_name }}-simulator.zip Hylo.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hylo ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Hylo ${{ github.ref_name }}

            ### Simulator Build
            This release includes a simulator `.app` bundle built for iOS Simulator (arm64 + x86_64).

            **To run on a simulator:**
            1. Unzip `Hylo-${{ github.ref_name }}-simulator.zip`
            2. Open Simulator.app on your Mac
            3. Drag `Hylo.app` onto the simulator window

            > **Note:** This build is unsigned and runs on simulators only.
            > A device build requires an Apple Developer account with signing certificates.
          files: |
            Hylo/build/Release-iphonesimulator/Hylo-${{ github.ref_name }}-simulator.zip
