name: iOS Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: hylo_flutter
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: hylo_flutter
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: hylo_flutter
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphoneos/Runner.app build/Payload/
          cd build
          zip -r Hylo.ipa Payload

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hylo-IPA
          path: hylo_flutter/build/Hylo.ipa

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hylo ${{ github.event.inputs.version }}
          tag_name: ${{ github.event.inputs.version }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, '-') }}
          body: |
            ## Hylo ${{ github.event.inputs.version }}

            ### Installation
            This IPA is **unsigned**. To install it on a device you will need to re-sign it with your own certificate using a tool like [AltStore](https://altstore.io), [Sideloadly](https://sideloadly.io), or Xcode.

            **Steps with Sideloadly:**
            1. Download `Hylo-${{ github.event.inputs.version }}.ipa`
            2. Open Sideloadly and connect your iPhone
            3. Drag the IPA in and sign with your Apple ID
          files: hylo_flutter/build/Hylo.ipa
